bot.terms_intro=Deyarli tayyor! Oxirgi qadam — buyurtma beriş şartlari bilan tanişib çiqing 👇
bot.terms=📜 <b>Buyurtma beriş şartlari</b>\n\n<b>1. Tölov.</b> Tölovni ikki usulda qiliş mumkin: <b>karta orqali oldindan</b> (tölovdan söng çek rasmini — skrinşotni yuborasiz) yoki <b>naqd pul bilan</b> — buyurtmani qabul qilganingizda.\n\n<b>2. Çek muddati.</b> Karta orqali tölovda buyurtma bergandan söng <b>30 daqiqa</b> içida çek yuborilmasa, buyurtma avtomatik bekor qilinadi.\n\n<b>3. Bekor qiliş.</b> Buyurtma berilgandan söng uni bekor qiliş (karta orqali tölangan bölsa — pulni qaytarib oliş ham) faqat biz bilan boğlaniş orqali mumkin.\n\n<b>4. Yetkazib beriş.</b> Buyurtmalar Yandex kuryeri orqali yetkazib beriladi. Yetkazib beriş narxini kuryerga özingiz tölaysiz, u mahsulot narxiga kirmaydi.\n\n<b>5. Manzil va aloqa.</b> Manzilni xaritada aniq belgilang va telefoningiz yoqiq bölsin — kuryer siz bilan boğlanadi. Notöğri manzil yoki aloqa yöqligi sababli kechikiş uçun javobgar emasmiz. Buyurtma berilgandan söng manzil yoki raqamni özgartiriş uçun biz bilan boğlaning.\n\n<b>6. Maʼlumotlar.</b> Ismingiz va telefon raqamingiz faqat buyurtmani bajariş va siz bilan boğlaniş uçun işlatiladi.
