bot.terms_intro=Почти готово! Последний шаг — ознакомьтесь с условиями заказа 👇
bot.terms=📜 <b>Условия заказа</b>\n\n<b>1. Оплата.</b> Оплатить можно двумя способами: <b>картой заранее</b> (после оплаты отправите фото — скриншот чека) или <b>наличными</b> — при получении заказа.\n\n<b>2. Срок чека.</b> При оплате картой, если чек не отправлен в течение <b>30 минут</b> после заказа, заказ отменяется автоматически.\n\n<b>3. Отмена.</b> Отменить заказ после оформления (и вернуть деньги, если оплачено картой) можно только связавшись с нами.\n\n<b>4. Доставка.</b> Заказы доставляет курьер Яндекс. Доставку вы оплачиваете курьеру сами, она не входит в цену товара.\n\n<b>5. Адрес и связь.</b> Точно отметьте адрес на карте и держите телефон включённым — курьер свяжется с вами. Мы не несём ответственности за задержку из‑за неверного адреса или отсутствия связи. Чтобы изменить адрес или номер после оформления заказа, свяжитесь с нами.\n\n<b>6. Данные.</b> Ваше имя и номер телефона используются только для выполнения заказа и связи с вами.
